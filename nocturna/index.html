<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda Libre</title>
    <meta name="description" content="Descubre Medellín en bici cuando se encienden las luces.">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-950 text-white">

    <main>
        <section class="px-6 py-16 md:py-24" aria-labelledby="titulo-nocturna">
            <div class="mx-auto max-w-3xl space-y-8 text-center">

                <p
                    class="inline-block rounded-full bg-amber-400 px-4 py-1 text-xs font-semibold uppercase tracking-widest text-slate-950">
                    Nuevo · Jueves a sábado
                </p>

                <h1 id="titulo-nocturna"
                    class="text-5xl font-extrabold leading-tight tracking-tight text-white md:text-7xl">
                    Rueda Nocturna
                </h1>

                <p class="mx-auto max-w-xl text-lg leading-relaxed text-slate-300 md:text-xl">
                    Descubre Medellín en bici cuando se encienden las luces
                </p>

                <ul class="space-y-4">
                    <li class="mx-auto w-56 rounded-xl bg-slate-900 p-4">
                        <p class="text-3xl font-bold text-amber-400">3 rutas</p>
                    </li>
                    <li class="mx-auto w-56 rounded-xl bg-slate-900 p-4">
                        <p class="text-3xl font-bold text-amber-400">Desde $55.000</p>
                    </li>
                </ul>

                <p>
                    <a href="#"
                        class="inline-block cursor-pointer rounded-full border-2 px-8 py-3 text-lg font-bold shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-offset-slate-950 border-transparent bg-amber-400 text-slate-950 hover:bg-amber-300 focus:ring-amber-200">Inscríbete</a>
                </p>

            </div>
        </section>

        <section class="px-6 pb-16 md:pb-24" aria-labelledby="titulo-botones">
            <div class="mx-auto max-w-3xl space-y-6 text-center">
                <h2 id="titulo-botones" class="text-2xl font-bold text-white">Botones</h2>
                <p class="text-slate-300">Principal, secundario y de contorno, con estados hover y focus.</p>
                <div class="flex flex-wrap justify-center gap-4">
                    <button type="button"
                        class="inline-block cursor-pointer rounded-full border-2 px-8 py-3 text-lg font-bold shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-offset-slate-950 border-transparent bg-amber-400 text-slate-950 hover:bg-amber-300 focus:ring-amber-200">Principal</button>
                    <button type="button"
                        class="inline-block cursor-pointer rounded-full border-2 px-8 py-3 text-lg font-bold shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-offset-slate-950 border-transparent bg-slate-700 text-white hover:bg-slate-600 focus:ring-slate-300">Secundario</button>
                    <button type="button"
                        class="inline-block cursor-pointer rounded-full border-2 px-8 py-3 text-lg font-bold shadow-lg transition-colors focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-offset-slate-950 border-amber-400 bg-transparent text-amber-400 hover:bg-amber-400 hover:text-slate-950 focus:ring-amber-200">Contorno</button>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
